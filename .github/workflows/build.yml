name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            os: linux
            executable-suffix: ""
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            os: linux
            executable-suffix: ""
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            os: windows
            executable-suffix: .exe
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            os: windows
            executable-suffix: .exe
          - runner: macos-14
            target: aarch64-apple-darwin
            os: macos
            executable-suffix: ""
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            git \
            openssl \
            libasound2-dev \
            libfontconfig-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            libssl-dev \
            libvulkan-dev \
            libwayland-dev \
            libx11-xcb-dev \
            libxkbcommon-x11-dev \
            pkg-config

      - name: Install macOS fixture dependencies
        if: matrix.os == 'macos'
        run: |
          brew install git openssl@3
          brew --prefix openssl@3 | sed 's|$|/bin|' >> "$GITHUB_PATH"

      - name: Provision native SSH fixture helpers
        shell: pwsh
        run: |
          # Git is supplied by all five native runner images. Resolve its own
          # helper directory rather than relying on an SSH daemon or shell.
          $git = (Get-Command git -ErrorAction Stop).Source
          $execPath = (& $git --exec-path).Trim()
          if ($LASTEXITCODE -ne 0) { throw "Git helper discovery failed" }
          $suffix = "${{ matrix.executable-suffix }}"
          foreach ($name in @("git-upload-pack", "git-receive-pack")) {
            if (-not (Test-Path -LiteralPath (Join-Path $execPath "$name$suffix") -PathType Leaf)) {
              throw "Required Git helper is unavailable"
            }
          }
          # The later external RSA PEM fixture uses the openssl executable.
          # Git for Windows ships it alongside its runtime utilities.
          if ($IsWindows) {
            $gitRoot = Split-Path (Split-Path $git)
            $opensslDirectory = Join-Path $gitRoot "usr/bin"
            if (Test-Path -LiteralPath (Join-Path $opensslDirectory "openssl.exe")) {
              $env:PATH = "$opensslDirectory;$env:PATH"
              $opensslDirectory | Out-File -FilePath $env:GITHUB_PATH -Append
            }
          }
          $openssl = (Get-Command openssl -ErrorAction Stop).Source
          & $openssl version
          if ($LASTEXITCODE -ne 0) { throw "External key fixture generator is unavailable" }

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binaries
        run: cargo build --locked --release --all-features --bins --target ${{ matrix.target }}

      - name: Verify release binaries
        shell: pwsh
        run: |
          $files = @(
            "target/${{ matrix.target }}/release/manyhands${{ matrix.executable-suffix }}"
            "target/${{ matrix.target }}/release/manyhands-cli${{ matrix.executable-suffix }}"
          )
          $missing = $files | Where-Object { -not (Test-Path -LiteralPath $_ -PathType Leaf) }
          if ($missing) {
            throw "Missing release binaries: $($missing -join ', ')"
          }

      - name: Test headless credential and platform contracts
        run: cargo test --locked --target ${{ matrix.target }} --lib --test shared_key_registry --test key_storage --test session_credentials --test key_material --test ssh_fixture --test ssh_transport

      - name: Upload release binaries
        uses: actions/upload-artifact@v4
        with:
          name: manyhands-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/manyhands${{ matrix.executable-suffix }}
            target/${{ matrix.target }}/release/manyhands-cli${{ matrix.executable-suffix }}
          if-no-files-found: error
          retention-days: 14
