name: Build

on:
  # Automatic CI builds are disabled; builds can still be run manually.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Temporary Cycle 09 failure-only matrix. Restore from 923cac8
          # after the focused native run passes, then run the full matrix.
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            os: linux
            executable-suffix: ""
            test-target: --test=mutation_replay
            tests:
              - reenter::two_processes_submitting_the_same_new_request_make_one_commit
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            os: windows
            executable-suffix: .exe
            test-target: --lib
            tests:
              - repository::cleanup::tests::cleanup_branch_deletion_checks_oid_and_every_checkout
              - repository::cleanup::tests::cleanup_branch_guard_keeps_checkout_with_missing_commondir_registration
              - repository::cleanup::tests::cleanup_branch_guard_keeps_checkout_with_missing_gitdir_registration
              - repository::cleanup::tests::cleanup_branch_guard_requires_complete_admin_evidence
              - repository::cleanup::tests::cleanup_foreign_git_link_cannot_authorize_prune
              - repository::cleanup::tests::cleanup_foreign_git_link_cannot_hide_registered_checkout
              - repository::cleanup::tests::cleanup_hidden_index_assume_unchanged_preserves_edit_and_index
              - repository::cleanup::tests::cleanup_hidden_index_skip_worktree_preserves_edit_and_index
              - repository::cleanup::tests::cleanup_ignored_and_locked_are_preserved
              - repository::cleanup::tests::cleanup_partial_and_mixed_worktrees_require_recovery_without_more_removal
              - repository::cleanup::tests::cleanup_precheck_clean_and_dirty_cases_preserve_full_git_image
              - repository::cleanup::tests::cleanup_submodule_embedded_git_data_is_not_proved_safe_to_remove
              - repository::cleanup::tests::cleanup_submodule_hidden_dirty_files_are_preserved_recursively
              - repository::cleanup::tests::cleanup_submodule_ignored_files_are_preserved_recursively
              - repository::cleanup::tests::cleanup_submodule_unknown_or_advanced_state_is_not_safe_to_remove
              - repository::cleanup::tests::cleanup_tracking_guards_missing_expectation_zero_and_foreign_locks
              - repository::cleanup::tests::cleanup_tracking_ref_refusals_preserve_git_and_sql
              - repository::promotion::integrate::tests::persistence_seam_holds_one_lease_and_creates_no_commit_before_integrating_evidence
              - repository::promotion::observe::tests::prepared_generated_blob_is_bound_without_odb_or_other_writes
              - repository::promotion::observe::tests::preview_is_read_only_offline_and_does_not_take_repository_lease
          - runner: macos-14
            target: aarch64-apple-darwin
            os: macos
            executable-suffix: ""
            test-target: --test=document_promotion
            tests:
              - quality2_f11_preserves_active_child_handoff
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            git \
            openssl \
            libasound2-dev \
            libfontconfig-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            libssl-dev \
            libvulkan-dev \
            libwayland-dev \
            libx11-xcb-dev \
            libxkbcommon-x11-dev \
            pkg-config

      - name: Install macOS fixture dependencies
        if: matrix.os == 'macos'
        run: |
          brew install git openssl@3
          brew --prefix openssl@3 | sed 's|$|/bin|' >> "$GITHUB_PATH"

      - name: Provision native SSH fixture helpers
        shell: pwsh
        run: |
          # Git for Windows may omit standalone aliases for built-in helpers.
          # Check the same capabilities used by the shell-free fixture fallback.
          $git = (Get-Command git -ErrorAction Stop).Source
          $builtins = & $git --list-cmds=builtins
          if ($LASTEXITCODE -ne 0) { throw "Git helper discovery failed" }
          foreach ($name in @("upload-pack", "receive-pack")) {
            if ($builtins -notcontains $name) {
              throw "Required Git helper is unavailable"
            }
          }
          # Preserve the runner's native tools: Git's usr/bin also contains an
          # MSYS Perl that cannot configure the vendored MSVC OpenSSL build.
          if ($IsWindows) {
            $perl = (Get-Command perl -ErrorAction Stop).Source
            Write-Output "OpenSSL build Perl: $perl"
            & $perl -MIPC::Cmd -e 'exit($^O ne q(MSWin32))'
            if ($LASTEXITCODE -ne 0) { throw "Native Perl with IPC::Cmd is required" }
          }
          # Native runner OpenSSL generates the later external RSA PEM fixture.
          $openssl = (Get-Command openssl -ErrorAction Stop).Source
          & $openssl version
          if ($LASTEXITCODE -ne 0) { throw "External key fixture generator is unavailable" }

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          cache-on-failure: true

      - name: Build release binaries
        run: cargo build --locked --release --all-features --bins --target ${{ matrix.target }}

      - name: Verify release binaries
        shell: pwsh
        run: |
          $files = @(
            "target/${{ matrix.target }}/release/manyhands${{ matrix.executable-suffix }}"
            "target/${{ matrix.target }}/release/manyhands-cli${{ matrix.executable-suffix }}"
          )
          $missing = $files | Where-Object { -not (Test-Path -LiteralPath $_ -PathType Leaf) }
          if ($missing) {
            throw "Missing release binaries: $($missing -join ', ')"
          }

      - name: Test failing Cycle 09 native cases
        shell: pwsh
        env:
          NATIVE_TEST_FILTERS: ${{ toJSON(matrix.tests) }}
        run: |
          $filters = @(ConvertFrom-Json $env:NATIVE_TEST_FILTERS)
          & cargo test --locked --no-fail-fast --target '${{ matrix.target }}' '${{ matrix.test-target }}' -- @filters --exact
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload release binaries
        uses: actions/upload-artifact@v4
        with:
          name: manyhands-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/manyhands${{ matrix.executable-suffix }}
            target/${{ matrix.target }}/release/manyhands-cli${{ matrix.executable-suffix }}
          if-no-files-found: error
          retention-days: 14
