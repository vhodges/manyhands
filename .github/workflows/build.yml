name: Build

on:
  # Automatic CI builds are disabled; builds can still be run manually.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            os: linux
            executable-suffix: ""
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            os: linux
            executable-suffix: ""
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            os: windows
            executable-suffix: .exe
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            os: windows
            executable-suffix: .exe
          - runner: macos-14
            target: aarch64-apple-darwin
            os: macos
            executable-suffix: ""
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            git \
            openssl \
            libasound2-dev \
            libfontconfig-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            libssl-dev \
            libvulkan-dev \
            libwayland-dev \
            libx11-xcb-dev \
            libxkbcommon-x11-dev \
            pkg-config

      - name: Install macOS fixture dependencies
        if: matrix.os == 'macos'
        run: |
          brew install git openssl@3
          brew --prefix openssl@3 | sed 's|$|/bin|' >> "$GITHUB_PATH"

      - name: Provision native SSH fixture helpers
        shell: pwsh
        run: |
          # Git for Windows may omit standalone aliases for built-in helpers.
          # Check the same capabilities used by the shell-free fixture fallback.
          $git = (Get-Command git -ErrorAction Stop).Source
          $builtins = & $git --list-cmds=builtins
          if ($LASTEXITCODE -ne 0) { throw "Git helper discovery failed" }
          foreach ($name in @("upload-pack", "receive-pack")) {
            if ($builtins -notcontains $name) {
              throw "Required Git helper is unavailable"
            }
          }
          # Preserve the runner's native tools: Git's usr/bin also contains an
          # MSYS Perl that cannot configure the vendored MSVC OpenSSL build.
          if ($IsWindows) {
            $perl = (Get-Command perl -ErrorAction Stop).Source
            Write-Output "OpenSSL build Perl: $perl"
            & $perl -MIPC::Cmd -e 'exit($^O ne q(MSWin32))'
            if ($LASTEXITCODE -ne 0) { throw "Native Perl with IPC::Cmd is required" }
          }
          # Native runner OpenSSL generates the later external RSA PEM fixture.
          $openssl = (Get-Command openssl -ErrorAction Stop).Source
          & $openssl version
          if ($LASTEXITCODE -ne 0) { throw "External key fixture generator is unavailable" }

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          cache-on-failure: true

      - name: Build release binaries
        run: cargo build --locked --release --all-features --bins --target ${{ matrix.target }}

      - name: Verify release binaries
        shell: pwsh
        run: |
          $files = @(
            "target/${{ matrix.target }}/release/manyhands${{ matrix.executable-suffix }}"
            "target/${{ matrix.target }}/release/manyhands-cli${{ matrix.executable-suffix }}"
          )
          $missing = $files | Where-Object { -not (Test-Path -LiteralPath $_ -PathType Leaf) }
          if ($missing) {
            throw "Missing release binaries: $($missing -join ', ')"
          }

      - name: Test headless credential and platform contracts
        run: cargo test --locked --target ${{ matrix.target }} --lib --test shared_key_registry --test key_storage --test session_credentials --test key_material --test ssh_fixture --test ssh_transport --test remote_observation --test remote_synchronization --test remote_merge_recovery --test remote_reservation --test recovery_foundation_gate --test repository_enablement --test local_authoring --test discovery_rebuild --test read_boundary --test read_contract --test read_relationships --test read_repository --test read_credentials --test read_items --test read_comments --test read_status --test canonical_foundation --test mutation_relationships

      - name: Upload release binaries
        uses: actions/upload-artifact@v4
        with:
          name: manyhands-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/manyhands${{ matrix.executable-suffix }}
            target/${{ matrix.target }}/release/manyhands-cli${{ matrix.executable-suffix }}
          if-no-files-found: error
          retention-days: 14
