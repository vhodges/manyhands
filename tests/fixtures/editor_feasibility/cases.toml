[large]
# Repeat UTF-8 source, truncate to the last character boundary <= size, then
# pad with ASCII spaces to exactly size. Hashes identify originals, not readback.
pattern = "# Scratch\n\nCafé 😀 עברית\n\n| A | B |\n| --- | --- |\n| one | two |\n\n:::unknown\nraw $$x$$ words\n:::\n"
small_bytes = 102400
larger_bytes = 262144
