[package]
name = "manyhands"
version = "0.1.0"
edition = "2024"
authors = ["Vince Hodges <vhodges@gmail.com>"]
license = "MIT"
autobins = false

[features]
default = []
desktop = ["dep:gpui-kit"]
editor-probe = ["desktop", "dep:zorite-editor"]

[dependencies]
blake3 = "1"
directories = "5"
fs4 = "0.13"
git2 = "0.20"
gpui-kit = { version = "0.6", optional = true }
libc = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
sha1 = "0.11"
ssh-key = { version = "0.6.7", features = ["ed25519", "encryption", "getrandom"] }
zeroize = "1"
zorite-editor = { version = "=0.10.0", optional = true }
tempfile = "3"
time = { version = "0.3", features = ["formatting", "parsing"] }
toml = "0.8"
ulid = "1"

[target.'cfg(windows)'.dependencies]
libssh2-sys = { version = "=0.3.3", features = ["openssl-on-win32", "vendored-openssl"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Memory", "Win32_System_Threading"] }

[[bin]]
name = "manyhands"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "manyhands-cli"
path = "src/bin/manyhands-cli.rs"

[dev-dependencies]
russh = { version = "=0.63.3", default-features = false, features = ["ring", "rsa"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "process", "sync", "time", "io-util"] }

[[test]]
name = "ssh_fixture"
harness = false

[[test]]
name = "ssh_transport"
harness = false

[[test]]
name = "remote_observation"
harness = false

[[test]]
name = "remote_synchronization"
harness = false

[[test]]
name = "editor_feasibility"
path = "tests/editor_feasibility.rs"
required-features = ["editor-probe"]

[[example]]
name = "editor_feasibility"
path = "examples/editor_feasibility.rs"
required-features = ["editor-probe"]
